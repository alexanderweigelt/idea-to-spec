name: Prompt tests

# Stage 1 (static, free) on every push and pull request.
# Stage 2 (scenario runs, paid) by hand (Actions > Prompt tests > Run workflow)
# and automatically as regression test when a release/<version> branch is pushed.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario folder in tests/scenarios
        default: requirements-vereinskasse
      model:
        description: Tested model
        type: choice
        options: [claude-haiku-5-5, claude-sonnet-5-5, claude-opus-5-5]
        default: claude-haiku-5-5
      runs:
        description: Number of runs (stops early after 2 equal results)
        default: "3"
      dry_run:
        description: Cost estimate only, no API call
        type: boolean
        default: true
      commit_results:
        description: Commit tests/runs to this branch
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tests/static_check.py

  scenario:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency: prompt-tests-paid
    permissions:
      contents: write   # commit results
      id-token: write   # GitHub OIDC token for Workload Identity Federation (no API key)
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-jwt
      # Manual start: values from the form. Release push: target model, 3 runs, paid, results committed.
      SCENARIO: ${{ inputs.scenario || 'requirements-vereinskasse' }}
      MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
      RUNS: ${{ inputs.runs || '3' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      COMMIT: ${{ github.event_name == 'push' || inputs.commit_results }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - name: Keep a fresh OIDC token on disk
        if: env.DRY_RUN != 'true'
        # GitHub tokens expire after ~5 minutes and each may be exchanged only once;
        # the SDK rereads the file on every exchange, so refresh it in the background.
        run: |
          fetch() { curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" \
            && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"; }
          fetch
          nohup bash -c "$(declare -f fetch); while sleep 120; do fetch; done" >/dev/null 2>&1 &
      - name: Run scenario
        run: |
          args="$SCENARIO --model $MODEL --runs $RUNS"
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          python tests/run.py $args | tee "$RUNNER_TEMP/out.txt"
          { echo '```'; cat "$RUNNER_TEMP/out.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          latest=$(ls -td tests/runs/*/ 2>/dev/null | head -1)
          if [ -n "$latest" ] && [ -f "$latest/summary.md" ]; then cat "$latest/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Commit results
        if: env.DRY_RUN != 'true' && env.COMMIT == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/runs
          git diff --cached --quiet || { git commit -m "chore: add prompt test results ($SCENARIO, $MODEL)"; git push; }
